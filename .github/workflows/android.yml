name: Android APK

# build.yml builds the Windows GUI. This builds the Android app instead, once per ABI, so an
# arm64 device does not download the x86_64 runtime and vice versa: the fat APK is 15 MB, each
# of these is ~7.6 MB.

on:
  workflow_dispatch:
  push:
    branches: [ AssetStudioMod ]
    # A tag is what publishes. Pushing v0.19.0 builds both ABIs and opens a release with them.
    # Push one tag at a time. The fork inherits the upstream's tags, so "git push --tags" would
    # fire a run per inherited tag and open a release for each of them.
    tags: [ 'v*' ]
  pull_request:
    branches: [ AssetStudioMod ]

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # net10.0-android targets API 36 (minSdk 26, from SupportedOSPlatformVersion).
  ANDROID_API_LEVEL: 36
  ANDROID_BUILD_TOOLS: 36.0.0
  PROJECT: AssetStudio.Android/AssetStudio.Android.csproj

jobs:
  apk:
    name: APK ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rid: android-arm64
          - abi: x86_64
            rid: android-x64

    steps:
      - uses: actions/checkout@v4

      # .NET for Android needs JDK 17+ and finds it through $JAVA_HOME, which setup-java sets.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install the Android workload
        run: dotnet workload install android

      # The runner image has an Android SDK, but not necessarily the API level this project
      # targets, and BuildApk fails without it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} platform-tools'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # -r picks a single ABI. The SDK narrows jniLibs/**/*.so down to it (the auto-include is
      # **/*.so relative to the project dir), so the APK carries one lib/<abi>/ tree. The Shizuku
      # AARs under libs/ are ABI-independent and ship in both.
      #
      # Release with no keystore configured is signed with the debug key, which adb installs fine
      # (-r -d if the install has to go backwards). AndroidPackageFormats=apk skips the .aab.
      - name: Publish APK (${{ matrix.abi }})
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -f net10.0-android \
            -r "${{ matrix.rid }}" \
            -p:AndroidPackageFormats=apk \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            --nologo

      - name: Collect the APK
        run: |
          set -euo pipefail
          dir="AssetStudio.Android/bin/Release/net10.0-android/${{ matrix.rid }}/publish"
          apk="$(find "$dir" -maxdepth 1 -name '*-Signed.apk' | head -1)"
          if [ -z "$apk" ]; then
            echo "no signed APK in $dir:"; ls -la "$dir" || true; exit 1
          fi

          echo "=== $apk ==="
          ls -l "$apk"
          echo "=== native ABIs ==="
          unzip -l "$apk" | grep -oE 'lib/[^/]+/' | sort -u

          # A wrong RID would quietly produce a multi-ABI APK, which is the thing this workflow
          # exists to avoid, so fail instead of uploading it.
          count="$(unzip -l "$apk" | grep -oE 'lib/[^/]+/' | sort -u | wc -l)"
          if [ "$count" != "1" ]; then
            echo "expected exactly one ABI in the APK, found $count"; exit 1
          fi

          mkdir -p dist
          # The commit in the name, because several builds of the same branch end up in the
          # device's Downloads folder and "which one is this" is otherwise unanswerable.
          name="AssetStudioMod-android-${{ matrix.abi }}-${GITHUB_SHA:0:7}.apk"
          cp "$apk" "dist/$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - name: Summary
        run: echo "\`$APK_NAME\` (${{ matrix.abi }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: AssetStudioMod-android-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # Publishing is a tag's job, not a branch's: a branch push uploads artifacts to look at, a tag
  # ships them. needs: apk means a release is only opened when both ABIs built and passed the
  # one-ABI check above.
  release:
    name: Release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: What is going out
        run: ls -l dist

      # The two APKs, named with the commit they came from. Notes are the commits since the last
      # release, which is the part of a release nobody writes by hand.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
